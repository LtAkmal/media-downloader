# Example nginx server for the public site. The header "X-Ytdl-Public: 1" turns on public mode in the app:
# visitors only see their own jobs, cookies.txt is not used, LAN/private URLs and the generic extractor are refused,
# and the PUBLIC_* limits apply. Requests that reach the app directly (LAN) keep the full mode, so never expose
# port 18096 to the internet without this proxy.
limit_req_zone  $binary_remote_addr zone=ytdl_api:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=ytdl_job:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ytdl_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name downloader.example.com;
    ssl_certificate     /etc/letsencrypt/live/downloader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloader.example.com/privkey.pem;
    limit_conn ytdl_conn 20;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Ytdl-Public 1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/update { return 403; }
    location ~ ^/api/(info|download)$ { limit_req zone=ytdl_job burst=6 nodelay; proxy_read_timeout 130s; proxy_pass http://127.0.0.1:18096; }
    location ^~ /api/file/ { limit_req zone=ytdl_api burst=30 nodelay; proxy_buffering off; proxy_read_timeout 600s; proxy_pass http://127.0.0.1:18096; }
    location / { limit_req zone=ytdl_api burst=60 nodelay; proxy_pass http://127.0.0.1:18096; }
}
